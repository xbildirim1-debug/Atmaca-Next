name: APK ve ZIP Arsivi
on:
  workflow_run:
    workflows: ["Atmaca Next APK"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: [".github/workflows/archive-release.yml"]
  workflow_dispatch:
    inputs:
      run_id:
        description: Basarili main APK derlemesinin run ID degeri
        required: false
        type: string
        default: '37341767741'
permissions:
  contents: write
  actions: read
concurrency:
  group: apk-archive-${{ github.event.workflow_run.id || inputs.run_id || '37341767741' }}
  cancel-in-progress: false
jobs:
  archive:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: APK, kaynak ZIP ve not defterini yayinla
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id || '37341767741' }}
        run: python3 scripts/archive_release.py
