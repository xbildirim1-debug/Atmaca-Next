name: Patch 26.36 commenter runtime

on:
  push:
    branches:
      - 26.36-engagement-drain

permissions:
  contents: write

jobs:
  patch-runtime:
    if: ${{ !contains(github.event.head_commit.message, '[26.36-runtime-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 26.36-engagement-drain
          fetch-depth: 0
      - name: Patch commenter viewport advance
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/com/atmacanext/app/automation/AutomationRuntime.kt')
          text = path.read_text(encoding='utf-8')
          start_marker = '                if (current.taskType == TaskType.COMMENTER_FOLLOW && commenterAdvanceRequired) {'
          end_marker = '                val excluded = processedHandles + skippedHandles + setOf('
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0 or text.find(start_marker, start + 1) >= 0:
              raise SystemExit(f'Unable to identify unique commenter advance block: start={start} end={end}')
          new_lines = [
              '                if (current.taskType == TaskType.COMMENTER_FOLLOW && commenterAdvanceRequired) {',
              '                    commenterAdvanceRequired = false',
              '                    val afterReturnExcluded = processedHandles + skippedHandles + setOf(',
              '                        XIdentityDetector.normalizeUsername(current.username.orEmpty()),',
              '                        target,',
              '                    )',
              '                    val visibleAfterReturn = XTweetInspector.visibleReplyAuthors(root)',
              '                    if (CommenterViewportPolicy.shouldScroll(visibleAfterReturn, afterReturnExcluded)) {',
              '                        val accepted = dispatchListScroll(service, root, forward = true)',
              '                        if (accepted) {',
              '                            listScrolls++',
              '                            _state.value = _state.value.copy(listScrolls = listScrolls)',
              '                        }',
              '                        lastListSignature = DiscoveryViewportEvidence.signature(AccessibilityTree.snapshots(root))',
              '                        nextActionNotBefore = now + AutomationTuning.scaleDelay(900L)',
              '                        OperationLog.i("COMMENT_SCROLL", "Görünür işlenmemiş yorumcu kalmadı; alt yorumlara kaydırma accepted=$accepted scroll=$listScrolls")',
              '                        service.requestAutomationTick(900L)',
              '                        return',
              '                    }',
              '                    OperationLog.i("COMMENT_DRAIN", "Aynı görünümde işlenmemiş yorumcu var; kaydırmadan sıradaki kullanıcı işlenecek")',
              '                }',
          ]
          replacement = '\n'.join(new_lines) + '\n'
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
      - name: Commit runtime patch
        run: |
          git config user.name "Atmaca Next CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/atmacanext/app/automation/AutomationRuntime.kt
          git diff --cached --quiet && exit 0
          git commit -m "26.36: drain visible commenters before scroll [26.36-runtime-patched]"
          git push origin HEAD:26.36-engagement-drain
