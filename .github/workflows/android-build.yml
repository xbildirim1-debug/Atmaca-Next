name: Atmaca Next APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android SDK
        run: sdkmanager "platform-tools" "platforms;android-37.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Tests, lint and APK
        run: |
          python3 scripts/verify_quote_migration.py
          gradle --no-daemon testDebugUnitTest lintDebug :app:assembleDebug --stacktrace
      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          apkanalyzer manifest print "$APK" > dist/manifest.xml
          if rg -q 'android.permission.INTERNET|androidx.startup.InitializationProvider' dist/manifest.xml; then exit 1; fi
          cp "$APK" dist/AtmacaNext-26.53.apk
          sha256sum dist/AtmacaNext-26.53.apk > dist/AtmacaNext-26.53.apk.sha256
          cp NOT_DEFTERI.txt dist/NOT_DEFTERI.txt
          python3 scripts/package_build_notes.py
          git archive --format=zip --output=dist/AtmacaNext-26.53-Kaynak.zip HEAD
          (cd dist && sha256sum *.apk *-Kaynak.zip *-Testler.zip NOT_DEFTERI.txt manifest.xml > SHA256SUMS.txt)
          (cd dist && zip AtmacaNext-26.53-TAM-PAKET.zip *.apk *.sha256 *.xml *.txt *-Kaynak.zip *-Testler.zip)
          (cd dist && sha256sum AtmacaNext-26.53-TAM-PAKET.zip >> SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: AtmacaNext-26.53-APK
          path: dist/
          if-no-files-found: error
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
